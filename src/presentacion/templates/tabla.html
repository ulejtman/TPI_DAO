<div class="tabla-contenedor" role="region" aria-label="{{ titulo }}" tabindex="0"><table>
<thead><tr>{% for col in columnas %}<th scope="col">{{ col }}</th>{% endfor %}{% if filas.0.url %}<th scope="col"><span class="sr-only">Acciones</span></th>{% endif %}</tr></thead>
<tbody>{% for fila in filas %}<tr>{% for celda in fila.celdas %}<td>{{ celda }}</td>{% endfor %}{% if fila.url %}<td><a class="enlace-fila" href="{{ fila.url }}">Abrir <span aria-hidden="true">→</span></a></td>{% endif %}</tr>{% empty %}<tr><td colspan="12"><div class="vacio"><strong>Todavía no hay registros</strong><p>Las operaciones que registres aparecerán aquí.</p></div></td></tr>{% endfor %}</tbody></table></div>
